<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">临床试验监查助手</title>
  <desc id="desc">面向 CRA 的本地监查辅助工具：上传文件，检索条款，标记疑点，生成报告草稿。</desc>
  <rect width="1200" height="390" rx="28" fill="#0b1220"/>
  <path d="M54 326H1146" stroke="#26364b" stroke-width="2"/>
  <path d="M760 48V324M934 48V324" stroke="#1b2a3d" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
